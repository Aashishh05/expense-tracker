<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5ebd0" />
    <meta name="description" content="Expense Tracker — income, expenses, budgets, recurring entries and shared group spending." />
    <script>
      // Apply the saved theme before first paint so there is no light flash.
      (function () {
        try {
          var stored = localStorage.getItem('expense-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#150d0e' : '#f5ebd0');
        } catch (e) {
          /* storage blocked — stay light */
        }
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%237f011f%22/><path d=%22M27 36c0-4 3-7 7-7h32l7 7v27c0 4-3 7-7 7H34c-4 0-7-3-7-7V36z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linejoin=%22round%22/><path d=%22M27 43h34c5 0 9 4 9 9s-4 9-9 9H46%22 fill=%22none%22 stroke=%22white%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><circle cx=%2261%22 cy=%2252%22 r=%223.5%22 fill=%22white%22/></svg>"
    />
    <link
      rel="apple-touch-icon"
      href="/icons/pwa-192.png"
    />
    <title>Expense Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
